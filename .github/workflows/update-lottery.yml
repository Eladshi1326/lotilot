# 🤖 הסוכן של לוטי לוט — מביא תוצאות ומועדי הגרלות מהפיס.
#
# ההגרלות מתקיימות בשעות קבועות (שעון ישראל), ולכן הסוכן רץ רק אחריהן:
#
#   צ'אנס   א'–ה' 09,11,13,15,17,19,21 · ו' 10,12,14 · מוצ"ש 21:30, 23:30
#   777     א'–ה' 13:30 ו-19:30 · ו' 13:30 · מוצ"ש 21:30
#   123     א'–ה' 18:00 · ו' 13:00 · מוצ"ש 21:30
#   לוטו    שלישי ושבת, סביב 23:15
#
# הקרון של גיטהאב הוא ב-UTC, וישראל היא UTC+2 בחורף ו-UTC+3 בקיץ,
# לכן החלון מכסה את שתי ההזזות — עדיין ~24 ריצות ביום במקום 144.
# הסוכן שומר קומיט רק אם באמת השתנה משהו, כך שריצה מיותרת לא עולה כלום.
#
# הרצה ידנית: בגיטהאב → Actions → הסוכן של לוטי לוט → Run workflow
#
# אם ההרצה נכשלת ב-Permission denied בשלב הדחיפה:
#   Settings → Actions → General → Workflow permissions → Read and write permissions

name: הסוכן של לוטי לוט

on:
  schedule:
    - cron: '12 6-21 * * *'
    - cron: '42 10,11,16,17,18,19,20,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lotilot-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: שליפת נתונים מהפיס
        run: node scripts/fetch-live.mjs

      - name: שמירה אם יש עדכון
        run: |
          if [ -n "$(git status --porcelain live-data.json)" ]; then
            git config user.name "lotilot-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live-data.json
            git commit -m "🤖 עדכון תוצאות אוטומטי [skip ci]"
            if git push; then
              echo "✓ הנתונים עודכנו ונדחפו"
            else
              echo "::error::הדחיפה נכשלה. Settings → Actions → General → Workflow permissions → Read and write permissions"
              exit 1
            fi
          else
            echo "אין שינוי — לא נדרש עדכון"
          fi
